hought this was possible. Thank you NuView."},{name:"Hunter Johnston",date:"May 16, 2025",quote:"Would definitely recommend Nuview for anybody looking for help. From the excellent staff, support groups, and fun social activities. Any mental health and substance abuse you can think of this place has done wonders. Thank you!!!!!"},{name:"Amber Spears",date:"May 21, 2025",quote:"Nuview is a phenomenal resource with an incredibly caring, patient and understanding group of staff. Their alumni out reach is phenomenal as well. Shout out to Danny, Carolina and Dakota especially!!!! Y'all were all amazing!"},{name:"Daniel Cho",date:"June 3, 2025",quote:"I was able to keep my job and still get the help I needed. The evening IOP fit around my schedule and the therapists actually listened. I finally feel like I have tools I can use outside of the room."},{name:"Priya Nair",date:"June 18, 2025",quote:"Starting virtually made it less intimidating. Same quality of care, same people, just from home. When I was ready I came in person. NuView never made me feel rushed or judged."},{name:"Chris Alvarez",date:"July 9, 2025",quote:"The dual-diagnosis approach was the difference for me. They treated the anxiety and the substance use together instead of pretending they were separate. Grateful I called when I did."}],og=[{q:"Will I have to put my job or life on hold?",a:"No. You don't need to pause your career to get treatment. Our PHP and IOP programs offer afternoon, evening and virtual options designed for working professionals, so you can keep working and keep up with your responsibilities while you get comprehensive support."},{q:"What's the difference between PHP and IOP?",a:"PHP (Partial Hospitalization) is our most intensive outpatient level — structured, comprehensive dual-diagnosis therapy for people who need a high level of support. IOP (Intensive Outpatient) uses flexible part-time sessions so you can maintain progress while staying connected to work, school, family and recover
